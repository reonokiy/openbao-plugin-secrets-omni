name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          version: 2026.7.5
          install: true
          install_args: --locked go openbao actionlint shellcheck
          cache: true
      - run: mise run --skip-tools lint
      - run: mise run --skip-tools test
      - run: mise run --skip-tools integration
      - name: Check OCI distribution image
        run: docker build dist/
